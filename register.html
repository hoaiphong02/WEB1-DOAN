<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng ký</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="main-header">
    <div class="logo">
      <a href="index.html">ShopCloth</a>
    </div>
    <nav class="navbar" style="display: flex; align-items: center; gap: 20px;">
      <a href="index.html">Trang Chủ</a>
      <a href="index.html">Sản Phẩm</a>
      <a href="cart.html">Giỏ Hàng</a>
      <a href="register.html">Đăng ký tài khoản</a>
    </nav>
  </header>

  <div class="auth-page-container">
    <div class="auth-card">
      <h2 class="auth-card-title">Tạo tài khoản mới</h2>
      <!-- Đã đổi action thành logged-index.html -->
      <form class="auth-form" action="logged-index.html">
        <div class="auth-field">
          <label>Họ và tên</label>
          <input type="text" placeholder="Nguyễn Văn A">
        </div>
        <div class="auth-field">
          <label>Email hoặc Số điện thoại</label>
          <input type="text" placeholder="0901234567">
        </div>
        <div class="auth-field">
          <label>Mật khẩu</label>
          <input type="text" placeholder="••••••••">
        </div>
        <button type="submit" class="btn-primary-custom" style="width: 100%;">Đăng ký</button>
      </form>
      <div class="auth-footer-text">
        <span>Đã có tài khoản? </span><a href="log-in.html">Đăng nhập ngay</a>
      </div>
    </div>
  </div>
</body>
</html>
