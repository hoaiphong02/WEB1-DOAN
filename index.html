<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop Quần Áo - Trang Chủ</title>
    <link rel="icon" type="image/png" href="images/logo-cat.png">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- 1. Header / Navbar -->
    <header class="main-header">
        <div class="logo">
            <a href="index.html">ShopCloth</a>
        </div>
        <nav class="navbar">
            <a href="index.html" class="active">Trang Chủ</a>
            <a href="index.html">Sản Phẩm</a>
            <a href="cart.html">Giỏ Hàng</a>
            <a href="account.html">Tài Khoản</a>
            <a href="admin/login.html" style="color: #38bdf8;">Quản Trị Admin</a>
        </nav>
    </header>

    <!-- Nội dung chính -->
    <div class="container">
        <!-- Sidebar: Bộ lọc & Form tìm kiếm nâng cao -->
        <aside class="sidebar">
            <h3>Bộ Lọc & Tìm Kiếm</h3>
            
            <!-- Ô tìm kiếm nhanh -->
            <div class="filter-group">
                <label for="searchInput">Tìm kiếm nhanh:</label>
                <input type="text" id="searchInput" placeholder="Nhập tên sản phẩm...">
            </div>

            <!-- Bộ lọc danh mục -->
            <div class="filter-group">
                <label for="categoryFilter">Danh mục:</label>
                <select id="categoryFilter">
                    <option value="all">Tất cả sản phẩm</option>
                    <option value="Áo khoác">Áo khoác</option>
                    <option value="Áo sơ mi/Thun">Áo sơ mi/Thun</option>
                    <option value="Quần Jean/Khaki">Quần Jean/Khaki</option>
                </select>
            </div>

            <!-- Form tìm kiếm nâng cao (theo khoảng giá) -->
            <div class="filter-group">
                <label>Tìm kiếm nâng cao (Giá):</label>
                <input type="number" id="minPrice" placeholder="Giá từ (VNĐ)">
                <input type="number" id="maxPrice" placeholder="Giá đến (VNĐ)">
                <button id="btnAdvancedSearch" class="btn-primary">Áp dụng bộ lọc</button>
            </div>
        </aside>

        <!-- Khu vực hiển thị Card sản phẩm -->
        <main class="product-content">
            <h2>Danh Sách Sản Phẩm</h2>
            
            <div class="product-grid" id="productGrid">
                <!-- Rendered dynamically by JS -->
            </div>

            <!-- Nút phân trang -->
            <div class="pagination" id="userPagination">
                <!-- Rendered dynamically by JS -->
            </div>
        </main>
    </div>

    <!-- Frontend JS -->
    <script src="js/main.js"></script>
</body>
</html>
