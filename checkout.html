<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đặt Hàng & Thanh Toán - ShopCloth</title>
    <link rel="icon" type="image/png" href="images/logo-cat.png">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Header / Navbar -->
    <header class="main-header">
        <div class="logo">
            <a href="index.html">
                <span class="logo-badge-icon">🐱</span>
                <span>ShopCloth</span>
            </a>
        </div>
        <div class="header-right-group">
            <nav class="navbar">
                <!-- Nút Home icon -->
                <a href="index.html" class="nav-home-btn" title="Trang chủ">
                    <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
                    </svg>
                </a>
            </nav>

            <!-- Icon Giỏ Hàng có Badge số lượng -->
            <a href="cart.html" class="nav-cart-btn" title="Giỏ hàng của bạn">
                <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z" />
                </svg>
                <span id="cartCountBadge" class="cart-badge"></span>
            </a>

            <!-- Phần người dùng nằm bên trái nút 3 gạch -->
            <div id="navUserSlot" style="display: inline-flex; align-items: center;">
                <a href="account.html" class="nav-account-link" style="color: #cbd5e1; font-size: 14.5px; font-weight: 500; text-decoration: none; padding: 6px 12px;">Tài Khoản</a>
            </div>

            <!-- Góc nút 3 gạch (không nền) -->
            <div class="menu-toggle-wrapper">
                <button type="button" class="btn-hamburger" id="btnHamburgerMenu" title="Menu quản trị">
                    ☰
                </button>
                <div class="hamburger-dropdown" id="hamburgerDropdown">
                    <a href="admin/login.html">
                        <span>🔐</span>
                        <span>Đăng nhập quản trị</span>
                    </a>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <div class="container" style="flex-direction: column;">
        <h1 style="font-size: 24px; margin-bottom: 24px; color: #f8fafc;">Thông Tin Đặt Hàng & Thanh Toán</h1>

        <form id="checkoutForm">
            <div class="checkout-layout">
                <!-- Cột trái: Thông tin giao hàng -->
                <div class="cart-box">
                    <h2>1. Địa Chỉ Nhận Hàng</h2>

                    <div class="form-row-customer">
                        <div class="form-group-customer">
                            <label for="orderCustomerName">Họ và tên người nhận:</label>
                            <input type="text" id="orderCustomerName" class="form-control-customer" placeholder="vd: Nguyễn Văn An" value="Nguyễn Văn An">
                        </div>

                        <div class="form-group-customer">
                            <label for="orderCustomerPhone">Số điện thoại liên hệ:</label>
                            <input type="text" id="orderCustomerPhone" class="form-control-customer" placeholder="vd: 0912345678" value="0912345678">
                        </div>
                    </div>

                    <div class="form-row-customer">
                        <div class="form-group-customer">
                            <label for="orderCustomerCity">Tỉnh / Thành phố:</label>
                            <input type="text" id="orderCustomerCity" class="form-control-customer" placeholder="vd: Hồ Chí Minh" value="Hồ Chí Minh">
                        </div>

                        <div class="form-group-customer">
                            <label for="orderCustomerAddress">Địa chỉ nhà / Số đường, Phường, Quận:</label>
                            <input type="text" id="orderCustomerAddress" class="form-control-customer" placeholder="vd: 123 Lê Lợi, Phường Bến Nghé, Quận 1" value="123 Lê Lợi, Quận 1">
                        </div>
                    </div>

                    <div class="form-group-customer">
                        <label for="orderCustomerNotes">Ghi chú giao hàng (Tùy chọn):</label>
                        <textarea id="orderCustomerNotes" class="form-control-customer" rows="2" placeholder="Ghi chú về thời gian nhận hàng hoặc chỉ dẫn..."></textarea>
                    </div>

                    <h2 style="margin-top: 24px;">2. Hình Thức Thanh Toán</h2>
                    <div class="payment-methods">
                        <label class="payment-option active">
                            <input type="radio" name="paymentMethod" value="COD" checked>
                            <div>
                                <strong style="color: #f8fafc;">Thanh toán khi nhận hàng (COD)</strong>
                                <div style="font-size: 12.5px; color: #94a3b8;">Nhận hàng kiểm tra và thanh toán tiền mặt trực tiếp cho shipper</div>
                            </div>
                        </label>

                        <label class="payment-option">
                            <input type="radio" name="paymentMethod" value="BANK">
                            <div>
                                <strong style="color: #f8fafc;">Chuyển khoản qua mã QR Ngân Hàng</strong>
                                <div style="font-size: 12.5px; color: #94a3b8;">Quét mã VietQR tiện lợi, xác nhận đơn hàng tự động</div>
                            </div>
                        </label>
                    </div>

                    <button type="submit" class="btn-primary" style="padding: 14px; font-size: 16px;">
                        ✓ Xác Nhận Đặt Hàng Ngay
                    </button>
                </div>

                <!-- Cột phải: Tóm tắt đơn hàng -->
                <div class="cart-box" style="height: fit-content;">
                    <h2>Đơn Hàng Của Bạn</h2>
                    <div id="checkoutSummaryItems">
                        <!-- Rendered by js/main.js -->
                    </div>

                    <div style="margin-top: 16px; font-size: 12.5px; color: #94a3b8; line-height: 1.6;">
                        <p>🔒 Thông tin đơn hàng được bảo mật an toàn.</p>
                        <p>🚚 Miễn phí giao hàng tiêu chuẩn trên toàn quốc.</p>
                    </div>
                </div>
            </div>
        </form>
    </div>

    <!-- Frontend JS -->
    <script src="js/main.js"></script>
</body>
</html>
