<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chi Tiết Sản Phẩm</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Header / Navbar -->
    <header class="main-header">
        <div class="logo">
            <a href="index.html">ShopCloth</a>
        </div>
        <nav class="navbar">
            <a href="index.html">Trang Chủ</a>
            <a href="index.html">Sản Phẩm</a>
            <a href="cart.html">Giỏ Hàng</a>
            <a href="account.html">Tài Khoản</a>
            <a href="admin/login.html" style="color: #38bdf8;">Quản Trị Admin</a>
        </nav>
    </header>

    <!-- Chi tiết sản phẩm -->
    <div class="container detail-container">
        <div class="product-image-large">
            <img src="images/jacket-black.png" alt="Chi tiết sản phẩm">
        </div>
        <div class="product-info-detail">
            <h1 id="productName">Áo Khoác Da Lộn Nam Cao Cấp (Đen)</h1>
            <p class="price-large" id="productPrice">1,299,000 đ</p>
            <p class="description">
                Mô tả chi tiết: Chất liệu da lộn mềm mịn, lót gió giữ ấm tốt, form ôm thanh lịch phong cách cá tính.
            </p>
            
            <div class="action-group">
                <label for="quantity">Số lượng:</label>
                <input type="number" id="quantity" value="1" min="1" style="width: 60px; padding: 5px;">
                <button class="btn-primary" id="btnAddCart">Thêm vào giỏ hàng</button>
            </div>
            
            <br>
            <a href="index.html" class="back-link">&larr; Quay lại trang sản phẩm</a>
        </div>
    </div>

    <!-- Frontend JS -->
    <script src="js/main.js"></script>
    <script>
        // Load thông tin chi tiết sản phẩm dựa theo query ?id=
        const prodId = new URLSearchParams(window.location.search).get('id') || 1;
        const prod = SHOP_PRODUCTS.find(p => p.id == prodId);
        if (prod) {
            document.querySelector('#productName').textContent = prod.name;
            document.querySelector('#productPrice').textContent = formatMoney(prod.price);
            document.querySelector('.product-image-large img').src = prod.image;
            document.querySelector('.description').textContent = 'Mô tả chi tiết: ' + prod.desc;
        }
    </script>
</body>
</html>
